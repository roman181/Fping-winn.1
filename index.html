<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Clash of Pepe: Arena Pro</title>
    <style>
        :root {
            --primary: #00e676;
            --accent: #d500f9;
            --danger: #ff1744;
            --warning: #ffea00;
            --bg-dark: #0a0a0a;
            --safe-bottom: env(safe-area-inset-bottom, 20px);
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; margin: 0; padding: 0; }
        body { 
            margin: 0; padding: 0; background-color: var(--bg-dark); font-family: 'Segoe UI', system-ui, sans-serif;
            color: white; overflow: hidden; touch-action: none; user-select: none;
            width: 100vw; height: 100vh;
        }
        .screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; flex-direction: column; overflow: hidden; }
        .screen.active { display: flex; }

        /* MENU */
        #menu-screen { background: linear-gradient(180deg, #0f0c29 0%, #302b63 50%, #24243e 100%); }
        .menu-header { padding: 15px 20px; background: rgba(0,0,0,0.7); display: flex; justify-content: space-between; align-items: center; backdrop-filter: blur(12px); border-bottom: 2px solid var(--accent); box-shadow: 0 4px 20px rgba(213, 0, 249, 0.3); }
        .logo-text { font-size: 24px; font-weight: 900; background: linear-gradient(45deg, var(--primary), var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .coin-pill { background: rgba(255, 234, 0, 0.15); padding: 8px 18px; border-radius: 25px; color: var(--warning); border: 2px solid var(--warning); font-weight: bold; font-size: 16px; }
        .menu-content { flex: 1; overflow-y: auto; padding: 20px; padding-bottom: 140px; }
        .shop-section { margin-bottom: 25px; }
        .section-title { font-size: 18px; font-weight: 800; color: var(--accent); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
        .shop-scroller { display: flex; gap: 15px; overflow-x: auto; padding: 10px 5px; scrollbar-width: none; }
        .shop-scroller::-webkit-scrollbar { display: none; }
        .chest-card { min-width: 130px; height: 160px; background: linear-gradient(145deg, #2a1a0a, #1a0a00); border-radius: 16px; border: 2px solid #8d6e63; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: all 0.3s ease; cursor: pointer; position: relative; overflow: hidden; }
        .chest-card:hover { transform: translateY(-5px); box-shadow: 0 10px 30px rgba(141, 110, 99, 0.4); border-color: var(--warning); }
        .chest-card:active { transform: scale(0.95); }
        .chest-icon { font-size: 50px; margin-bottom: 8px; }
        .chest-name { font-size: 14px; font-weight: bold; color: #fff; margin-bottom: 4px; }
        .chest-price { color: var(--warning); font-weight: bold; font-size: 16px; background: rgba(0,0,0,0.4); padding: 4px 12px; border-radius: 12px; }
        .chest-count { font-size: 11px; color: #aaa; margin-top: 4px; }

        .deck-builder { background: rgba(26, 42, 108, 0.3); border-radius: 20px; padding: 20px; margin: 20px 0; border: 2px solid var(--accent); box-shadow: 0 0 30px rgba(213, 0, 249, 0.15); }
        .deck-title { font-weight: bold; color: var(--accent); margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; font-size: 16px; }
        .deck-slots { display: flex; gap: 12px; overflow-x: auto; padding: 5px; scrollbar-width: none; }
        .deck-slots::-webkit-scrollbar { display: none; }
        .deck-slot { min-width: 80px; height: 110px; background: rgba(0,0,0,0.4); border-radius: 14px; border: 2px dashed #555; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 12px; color: #888; position: relative; flex-shrink: 0; transition: all 0.2s; }
        .deck-slot.filled { border-style: solid; border-color: var(--primary); background: rgba(0, 230, 118, 0.1); box-shadow: 0 0 15px rgba(0, 230, 118, 0.2); }
        .deck-slot img { width: 55px; height: 55px; object-fit: contain; margin-bottom: 5px; }
        .deck-slot .remove { position: absolute; top: -8px; right: -8px; width: 22px; height: 22px; background: var(--danger); border-radius: 50%; font-size: 14px; display: flex; align-items: center; justify-content: center; cursor: pointer; border: 2px solid white; }
        .deck-add-btn { min-width: 80px; height: 110px; background: rgba(213, 0, 249, 0.15); border-radius: 14px; border: 2px dashed var(--accent); color: var(--accent); font-size: 32px; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
        .deck-add-btn:hover { background: rgba(213, 0, 249, 0.3); }

        .inventory-section { margin-top: 25px; }
        .inventory-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; margin-top: 15px; }
        .unit-row { background: rgba(255,255,255,0.05); padding: 14px; border-radius: 16px; border: 1px solid #333; display: flex; justify-content: space-between; align-items: center; transition: all 0.2s; }
        .unit-row:hover { background: rgba(255,255,255,0.08); }
        .unit-row.in-deck { border-color: var(--primary); background: rgba(0, 230, 118, 0.05); }
        .unit-info { display: flex; align-items: center; gap: 15px; }
        .unit-img-ui { width: 60px; height: 60px; object-fit: contain; image-rendering: pixelated; }
        .unit-name { font-weight: bold; color: white; font-size: 15px; }
        .unit-level { color: var(--primary); font-weight: bold; }
        .unit-count { font-size: 12px; color: #aaa; }
        .unit-actions { display: flex; gap: 8px; }
        .btn-small { padding: 8px 14px; border-radius: 10px; border: none; font-weight: bold; font-size: 13px; cursor: pointer; transition: all 0.2s; }
        .btn-add { background: var(--accent); color: white; }
        .btn-add:disabled { background: #333; color: #777; cursor: default; }
        .btn-upgrade { background: var(--primary); color: #000; }
        .btn-upgrade:disabled { background: #333; color: #777; cursor: default; }

        .play-floater { position: absolute; bottom: 0; left: 0; width: 100%; padding: 20px; padding-bottom: calc(20px + var(--safe-bottom)); background: linear-gradient(to top, rgba(0,0,0,0.95), transparent); display: flex; justify-content: center; z-index: 100; }
        .btn-start { width: 100%; max-width: 400px; height: 65px; background: linear-gradient(135deg, #ff9800, #ff5722); border: none; border-radius: 33px; font-size: 20px; font-weight: 900; color: white; box-shadow: 0 6px 25px rgba(255, 87, 34, 0.5); cursor: pointer; transition: all 0.3s; }
        .btn-start:hover { transform: translateY(-3px); }
        .btn-start:disabled { background: #333; cursor: not-allowed; box-shadow: none; transform: none; }

        /* GAME */
        #game-screen { background: #000; }
        #gameCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        #game-ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        .top-hud { padding: 15px 20px; display: flex; justify-content: space-between; align-items: flex-start; background: linear-gradient(to bottom, rgba(0,0,0,0.85), transparent); pointer-events: auto; }
        .tower-hp-container { width: 140px; background: rgba(0,0,0,0.6); padding: 10px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); }
        .tower-label { font-size: 12px; margin-bottom: 6px; font-weight: bold; }
        .tower-label.player { color: var(--primary); }
        .tower-label.enemy { color: var(--danger); text-align: right; }
        .hp-bar-bg { width: 100%; height: 12px; background: #222; border-radius: 6px; border: 1px solid #444; overflow: hidden; position: relative; }
        .hp-fill { height: 100%; width: 100%; transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1); border-radius: 6px; }
        .hp-fill.player { background: linear-gradient(90deg, var(--primary), #00c853); }
        .hp-fill.enemy { background: linear-gradient(90deg, var(--danger), #b71c1c); }
        .hp-text { position: absolute; top: 0; left: 0; width: 100%; text-align: center; font-size: 10px; line-height: 12px; color: white; font-weight: bold; text-shadow: 0 1px 2px rgba(0,0,0,0.8); }
        .wave-display { text-align: center; font-weight: 900; font-size: 20px; color: var(--warning); text-shadow: 0 0 20px rgba(255, 234, 0, 0.5); background: rgba(0,0,0,0.6); padding: 8px 20px; border-radius: 20px; border: 1px solid rgba(255, 234, 0, 0.3); }

        .bot-hud { position: absolute; bottom: 0; width: 100%; pointer-events: auto; padding: 15px; padding-bottom: calc(15px + var(--safe-bottom)); background: linear-gradient(to top, rgba(0,0,0,0.95), rgba(0,0,0,0.5)); }
        .elixir-section { margin-bottom: 15px; }
        .elixir-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .elixir-label { color: var(--accent); font-weight: bold; font-size: 15px; display: flex; align-items: center; gap: 6px; }
        .elixir-value { color: var(--accent); font-weight: bold; font-size: 18px; }
        .elixir-bar-container { height: 14px; background: #111; border-radius: 7px; border: 1px solid #333; overflow: hidden; position: relative; }
        .elixir-fill { height: 100%; background: linear-gradient(90deg, var(--accent), #e040fb); width: 0%; transition: width 0.1s linear; border-radius: 7px; }
        .elixir-segments { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; }
        .elixir-segment { flex: 1; border-right: 1px solid rgba(255,255,255,0.1); }
        .elixir-segment:last-child { border-right: none; }

        .card-dock { display: flex; gap: 12px; overflow-x: auto; padding: 5px; scrollbar-width: none; }
        .card-dock::-webkit-scrollbar { display: none; }
        .game-card { min-width: 85px; height: 115px; background: linear-gradient(145deg, #1a1a2e, #16213e); border-radius: 16px; border: 2px solid #444; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: all 0.2s; flex-shrink: 0; position: relative; cursor: pointer; }
        .game-card.ready { border-color: var(--accent); box-shadow: 0 0 20px rgba(213, 0, 249, 0.4); transform: translateY(-3px); }
        .game-card.disabled { opacity: 0.4; filter: grayscale(0.9); cursor: default; transform: none; }
        .game-card:active:not(.disabled) { transform: scale(0.95); }
        .g-cost { position: absolute; top: -6px; right: -6px; background: linear-gradient(135deg, var(--accent), #aa00ff); width: 26px; height: 26px; border-radius: 50%; font-size: 13px; display: flex; align-items: center; justify-content: center; border: 2px solid white; font-weight: bold; }
        .g-img { width: 55px; height: 55px; object-fit: contain; margin-bottom: 4px; image-rendering: pixelated; }
        .g-name { font-size: 11px; font-weight: bold; color: #ddd; }
        .g-level { font-size: 10px; color: var(--primary); }

        #toast { position: fixed; top: 20%; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.9); color: white; padding: 14px 30px; border-radius: 30px; opacity: 0; transition: all 0.3s; z-index: 9999; border: 2px solid var(--accent); pointer-events: none; font-weight: bold; font-size: 16px; }
        #toast.show { opacity: 1; transform: translateX(-50%) translateY(-10px); }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; z-index: 1000; backdrop-filter: blur(5px); }
        .modal-overlay.active { display: flex; }
        .modal-content { background: linear-gradient(145deg, #1a1a2e, #0f0c29); border-radius: 24px; padding: 25px; max-width: 90vw; max-height: 80vh; overflow-y: auto; border: 2px solid var(--accent); }
        .modal-title { font-size: 20px; font-weight: 900; color: var(--accent); margin-bottom: 20px; text-align: center; }
        .modal-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 15px; }
        .modal-unit { background: rgba(255,255,255,0.05); border-radius: 16px; padding: 15px; text-align: center; cursor: pointer; border: 2px solid transparent; transition: all 0.2s; }
        .modal-unit:hover { border-color: var(--accent); background: rgba(213, 0, 249, 0.1); transform: scale(1.05); }
        .modal-unit img { width: 60px; height: 60px; object-fit: contain; margin-bottom: 8px; }
        .modal-unit-name { font-size: 13px; font-weight: bold; }
        .modal-unit-count { font-size: 11px; color: #aaa; }
        .modal-close { margin-top: 20px; width: 100%; padding: 12px; background: rgba(255,255,255,0.1); border: 1px solid #444; color: white; border-radius: 12px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

const AUDIO = {
    bgm: new Audio('https://github.com/roman181/Repo/raw/refs/heads/main/MT2.mp3'),
    victory: new Audio('https://www.soundjay.com/misc/sounds/bell-ringing-05.mp3'),
    spawn: new Audio('https://www.soundjay.com/buttons/sounds/button-20.mp3'),
    hit: new Audio('https://www.soundjay.com/buttons/sounds/button-3.mp3'),
    upgrade: new Audio('https://www.soundjay.com/buttons/sounds/button-09.mp3')
};
AUDIO.bgm.loop = true;
let muted = false;

let player = { coins: 300, units: {}, wave: 1, deck: [] };
Object.keys(UNIT_DB).forEach(k => player.units[k] = { l: 1, c: 0 });
['frosch_soldat', 'pinguin_schlaeger', 'schwein_revolver', 'frosch_sniper', 'pinguin_schuetze'].forEach(k => { player.units[k].c = 1; });

let game = {
    active: false, ctx: null, cvs: null, w: 0, h: 0, camX: 0, 
    elixir: 5, wTimer: 0, lastT: 0, shake: 0,
    ents: [], projs: [], particles: [], floatingTexts: [],
    towers: { 
        p:{x:100, hp:CFG.towerMaxHp, max:CFG.towerMaxHp, rng: 300, dmg: 40, cool: 0, atkSpd: 1.2}, 
        e:{x:1100, hp:CFG.towerMaxHp, max:CFG.towerMaxHp, rng: 300, dmg: 40, cool: 0, atkSpd: 1.2} 
    },
    battleDeck: [], frameCount: 0
};

function save() { localStorage.setItem(CFG.saveKey, JSON.stringify(player)); }
function load() {
    let s = localStorage.getItem(CFG.saveKey);
    if(s) {
        let d = JSON.parse(s);
        player.coins = d.coins || 300; player.wave = d.wave || 1;
        if(d.deck) player.deck = d.deck;
        Object.keys(d.units || {}).forEach(k => { if(player.units[k]) player.units[k] = d.units[k]; });
    }
}

function toast(m) { 
    const t = document.getElementById('toast'); 
    t.innerText = m; 
    t.classList.add('show'); 
    setTimeout(() => t.classList.remove('show'), 2500); 
}

function renderDeckSlots() {
    const container = document.getElementById('deck-slots');
    const countEl = document.getElementById('deck-count');
    const startBtn = document.getElementById('start-btn');
    container.innerHTML = '';
    player.deck.forEach((unitKey) => {
        const slot = document.createElement('div');
        slot.className = 'deck-slot filled';
        slot.innerHTML = `<img src="${IMAGES[unitKey].src}" onerror="this.style.display='none'"><div style="font-size:11px; font-weight:bold;">${UNIT_DB[unitKey].name}</div><div style="font-size:10px; color:var(--primary);">Lvl ${player.units[unitKey].l}</div><div class="remove" onclick="removeFromDeck('${unitKey}')">✕</div>`;
        container.appendChild(slot);
    });
    for(let i = player.deck.length; i < CFG.deckSize; i++) {
        if(i === player.deck.length) {
            const addBtn = document.createElement('div'); addBtn.className = 'deck-add-btn'; addBtn.innerHTML = '+'; addBtn.onclick = openUnitSelector;
            container.appendChild(addBtn);
        } else {
            const empty = document.createElement('div'); empty.className = 'deck-slot'; empty.innerHTML = '<div style="font-size:11px;">Leer</div>'; container.appendChild(empty);
        }
    }
    countEl.innerText = `${player.deck.length}/${CFG.deckSize}`;
    startBtn.disabled = player.deck.length !== CFG.deckSize;
    startBtn.innerHTML = player.deck.length !== CFG.deckSize ? `Wähle ${CFG.deckSize - player.deck.length} weitere 🔥` : 'KAMPF BEGINNEN 🔥';
}

function openUnitSelector() {
    const available = Object.keys(UNIT_DB).filter(k => !player.deck.includes(k) && player.units[k].c > 0);
    if(available.length === 0) return toast("Keine verfügbaren Karten!");
    const modal = document.getElementById('unit-modal');
    const grid = document.getElementById('modal-grid');
    grid.innerHTML = '';
    available.forEach(k => {
        const unit = document.createElement('div');
        unit.className = 'modal-unit';
        unit.onclick = () => { addToDeck(k); closeUnitSelector(); };
        unit.innerHTML = `<img src="${IMAGES[k].src}" onerror="this.style.display='none'"><div class="modal-unit-name">${UNIT_DB[k].name}</div><div class="modal-unit-count">${player.units[k].c}x verfügbar</div><div style="font-size:10px; color:${FACTION_COLORS[UNIT_DB[k].faction]}; margin-top:4px;">${UNIT_DB[k].faction.toUpperCase()}</div>`;
        grid.appendChild(unit);
    });
    modal.classList.add('active');
}

function closeUnitSelector() { document.getElementById('unit-modal').classList.remove('active'); }

function addToDeck(k) {
    if(player.deck.length >= CFG.deckSize || player.deck.includes(k)) return;
    player.deck.push(k); save(); renderDeckSlots(); renderMenu(); toast(`${UNIT_DB[k].name} hinzugefügt!`);
}

function removeFromDeck(k) {
    player.deck = player.deck.filter(u => u !== k); save(); renderDeckSlots(); renderMenu();
}

function renderMenu() {
    document.getElementById('coin-count').innerText = Math.floor(player.coins);
    const list = document.getElementById('inv-list'); list.innerHTML = '';
    Object.keys(player.units).forEach(k => {
        const u = player.units[k]; const inDeck = player.deck.includes(k); const db = UNIT_DB[k];
        const row = document.createElement('div'); row.className = `unit-row ${inDeck ? 'in-deck' : ''}`;
        row.innerHTML = `<div class="unit-info"><img src="${IMAGES[k].src}" class="unit-img-ui" onerror="this.style.display='none'"><div><div class="unit-name">${db.name} <span class="unit-level">Lvl ${u.l}</span> ${inDeck ? '<span style="color:var(--primary)">📋</span>' : ''}</div><div class="unit-count">${u.c}/2 Karten • ${db.desc}</div><div style="font-size:11px; color:${FACTION_COLORS[db.faction]}; margin-top:2px;">${db.faction.toUpperCase()} • 💰${db.cost} • ⚔️${db.dmg} • ❤️${db.hp}</div></div></div><div class="unit-actions">${!inDeck ? `<button class="btn-small btn-add" ${player.deck.length >= CFG.deckSize || u.c < 1 ? 'disabled' : ''} onclick="addToDeck('${k}')">+ Deck</button>` : ''}<button class="btn-small btn-upgrade" ${u.c < 2 ? 'disabled' : ''} onclick="merge('${k}')">UPGRADE</button></div>`;
        list.appendChild(row);
    });
    renderDeckSlots();
}

function buyChest(sz) {
    const prices = {small: 50, medium: 100, large: 200};
    const counts = {small: 2, medium: 5, large: 12};
    const p = prices[sz], n = counts[sz];
    if(player.coins >= p) { 
        player.coins -= p; 
        const keys = Object.keys(UNIT_DB); 
        for(let i = 0; i < n; i++) { player.units[keys[Math.floor(Math.random() * keys.length)]].c++; }
        save(); renderMenu(); toast(`🎁 ${n} Karten erhalten!`); 
        if(!muted) AUDIO.upgrade.play().catch(()=>{});
    } else toast("💰 Nicht genug Coins!");
}

function merge(k) { 
    if(player.units[k].c < 2) return;
    player.units[k].c -= 2; player.units[k].l++; save(); renderMenu(); toast(`✨ ${UNIT_DB[k].name} Level ${player.units[k].l}!`);
    if(!muted) AUDIO.upgrade.play().catch(()=>{});
}

// === PARTICLE SYSTEM ===
class Particle { 
    constructor(x, y, color, size = 4, speed = 12, life = 1.0) { 
        this.x = x; this.y = y; 
        this.vx = (Math.random() - 0.5) * speed; 
        this.vy = (Math.random() - 0.5) * speed - 3; 
        this.life = life; this.maxLife = life;
        this.color = color; this.size = size; this.gravity = 0.3;
    }
    update(dt) { 
        this.x += this.vx; this.y += this.vy; this.vy += this.gravity;
        this.life -= dt * 1.5; this.size *= 0.98;
    }
    draw(ctx) { 
        const alpha = Math.max(0, this.life / this.maxLife);
        ctx.globalAlpha = alpha; ctx.fillStyle = this.color; 
        ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill();
        ctx.globalAlpha = 1; 
    }
}

class FloatingText {
    constructor(x, y, text, color, size = 16) {
        this.x = x; this.y = y; this.text = text; this.color = color; this.size = size;
        this.life = 1.0; this.vy = -40;
    }
    update(dt) { this.y += this.vy * dt; this.life -= dt * 2; this.vy *= 0.98; }
    draw(ctx) {
        if(this.life <= 0) return;
        ctx.globalAlpha = Math.max(0, this.life);
        ctx.font = `bold ${this.size}px Arial`; ctx.fillStyle = this.color;
        ctx.strokeStyle = 'black'; ctx.lineWidth = 2; ctx.textAlign = 'center';
        ctx.strokeText(this.text, this.x, this.y); ctx.fillText(this.text, this.x, this.y);
        ctx.globalAlpha = 1;
    }
}

function spawnHit(x, y, color = "#ffeb3b", amount = null) { 
    for(let i = 0; i < 12; i++) game.particles.push(new Particle(x, y, color, 3 + Math.random() * 3, 10 + Math.random() * 8));
    if(amount !== null) game.floatingTexts.push(new FloatingText(x, y - 30, `-${Math.floor(amount)}`, color, 18));
    game.shake = 5; 
}

function spawnHeal(x, y) {
    for(let i = 0; i < 8; i++) game.particles.push(new Particle(x, y, "#00e676", 4, 8, 1.5));
    game.floatingTexts.push(new FloatingText(x, y - 30, "+HEAL", "#00e676", 16));
}

function spawnTowerExplosion(x, y) { 
    for(let i = 0; i < 60; i++) { 
        const color = i % 2 ? "#ff9800" : "#ff5722";
        game.particles.push(new Particle(x, y, color, 5, 18, 2.0)); 
    } 
    game.shake = 50; 
    game.floatingTexts.push(new FloatingText(x, y - 50, "💥 BOOM!", "#ff5722", 28));
}

function spawnSpawnEffect(x, y, isPlayer) {
    const color = isPlayer ? "#00e676" : "#ff1744";
    for(let i = 0; i < 20; i++) game.particles.push(new Particle(x, y, color, 4, 6, 0.8));
}

// === ENTITY SYSTEM ===
class Ent {
    constructor(k, isP, lvl, laneIdx) {
        const d = UNIT_DB[k];
        this.k = k; this.isP = isP; this.lvl = lvl;
        const scale = Math.pow(1.15, lvl - 1);
        this.max = d.hp * scale; this.hp = this.max;
        this.dmg = d.dmg * scale; this.rng = d.rng; this.spd = d.spd; this.proj = d.proj;
        this.atkDelay = 1.0 / (d.atkSpd || 1.0); this.cool = 0;
        this.w = 70; this.h = 70; this.atkFlash = 0;
        this.lane = laneIdx % 3;
        this.x = isP ? game.towers.p.x + 40 : game.towers.e.x - 40;
        this.y = (game.h * 0.55) + (this.lane * 40 - 40) + (Math.random() * 10 - 5);
        this.animFrame = 0; this.animTimer = 0;
        this.direction = isP ? 1 : -1;
        this.heal = d.heal || false;
        this.faction = d.faction;
    }

    update(dt) {
        this.animTimer += dt;
        if(this.animTimer > 0.15) { this.animTimer = 0; this.animFrame = (this.animFrame + 1) % 4; }
        if(this.atkFlash > 0) this.atkFlash -= dt * 6;
        if(this.cool > 0) this.cool -= dt;

        let target = null, bestScore = Infinity;
        const enemyTw = this.isP ? game.towers.e : game.towers.p;

        game.ents.forEach(e => {
            if(e.isP !== this.isP && e.hp > 0) {
                let dist = Math.abs(e.x - this.x);
                if(dist <= this.rng) {
                    let score = dist * 0.6 + (this.isP ? enemyTw.x - e.x : e.x - enemyTw.x) * 0.3 + e.hp * 0.0001;
                    if(this.heal && e.hp < e.max * 0.7) score -= 50;
                    if(score < bestScore) { bestScore = score; target = e; }
                }
            }
        });

        let distTw = Math.abs(enemyTw.x - this.x);
        if(!target && distTw <= this.rng) target = enemyTw;

        if(target) {
            if(this.cool <= 0) {
                this.cool = this.atkDelay; this.atkFlash = 1;
                if(target === enemyTw) {
                    enemyTw.hp -= this.dmg; 
                    spawnHit(enemyTw.x, this.y - 20, this.isP ? "#4caf50" : "#f44336", this.dmg);
                    if(!muted) AUDIO.hit.currentTime = 0, AUDIO.hit.play().catch(()=>{});
                } else {
                    if(this.heal && target.isP === this.isP) {
                        target.hp = Math.min(target.max, target.hp + this.dmg * 2);
                        spawnHeal(target.x, target.y);
                    } else {
                        if(this.proj) {
                            game.projs.push({ x: this.x, y: this.y - 35, tx: target.x, ty: target.y - 35, p: this.proj, d: this.dmg, target: target, dead: false, color: this.isP ? "#00e676" : "#ff1744" });
                        } else { 
                            target.hp -= this.dmg; 
                            spawnHit(target.x, target.y - 35, this.isP ? "#00e676" : "#ff1744", this.dmg); 
                            if(!muted) AUDIO.hit.currentTime = 0, AUDIO.hit.play().catch(()=>{}); 
                        }
                    }
                }
            }
        } else {
            let move = this.spd * dt * this.direction;
            let blocked = false; let pushY = 0;
            game.ents.forEach(e => {
                if(e.isP === this.isP && e !== this) {
                    let dx = e.x - this.x; let dy = e.y - this.y;
                    let dist = Math.sqrt(dx*dx + dy*dy);
                    if(dist < 35 && Math.abs(dx) < 30) { blocked = true; pushY += (dy > 0 ? -1 : 1) * 20 * dt; }
                }
            });
            if(!blocked) this.x += move;
            this.y += pushY;
            this.y = Math.max(game.h * 0.35, Math.min(game.h * 0.75, this.y));
        }
    }

    draw(ctx) {
        ctx.save(); ctx.translate(this.x, this.y);
        ctx.fillStyle = "rgba(0,0,0,0.3)";
        ctx.beginPath(); ctx.ellipse(0, 5, this.w * 0.4, 8, 0, 0, Math.PI * 2); ctx.fill();
        if(!this.isP) ctx.scale(-1, 1);
        if(this.atkFlash > 0.3) { ctx.shadowBlur = 20; ctx.shadowColor = this.isP ? "#00e676" : "#ff1744"; }
        const bob = Math.sin(this.animFrame * Math.PI / 2) * 3;
        const img = IMAGES[this.k];
        if(img && img.complete && img.naturalWidth > 0) {
            ctx.drawImage(img, -this.w/2, -this.h + bob, this.w, this.h);
        } else {
            ctx.fillStyle = FACTION_COLORS[this.faction] || "#888";
            ctx.fillRect(-this.w/2, -this.h + bob, this.w, this.h);
            ctx.font = "30px Arial"; ctx.textAlign = "center";
            ctx.fillText(this.isP ? "🐸" : "👾", 0, -20 + bob);
        }
        ctx.restore();

        const hpPercent = this.hp / this.max;
        const barW = 50, barH = 6;
        ctx.fillStyle = "rgba(0,0,0,0.7)"; ctx.fillRect(this.x - barW/2, this.y - this.h - 18, barW, barH);
        const hpColor = hpPercent > 0.6 ? "#00e676" : hpPercent > 0.3 ? "#ffea00" : "#ff1744";
        ctx.fillStyle = hpColor; ctx.fillRect(this.x - barW/2, this.y - this.h - 18, barW * hpPercent, barH);
        ctx.font = "bold 11px Arial"; ctx.fillStyle = "white"; ctx.textAlign = "center";
        ctx.strokeStyle = "black"; ctx.lineWidth = 2;
        ctx.strokeText(`Lv${this.lvl}`, this.x, this.y - this.h - 22);
        ctx.fillText(`Lv${this.lvl}`, this.x, this.y - this.h - 22);
    }
}

// === TOWER SYSTEM ===
function updateTowers(dt) {
    ['p', 'e'].forEach(side => {
        const tw = game.towers[side];
        tw.cool -= dt;
        if(tw.cool <= 0) {
            let closest = null, minD = Infinity;
            game.ents.forEach(e => {
                if(e.isP !== (side === 'p')) {
                    let d = Math.abs(e.x - tw.x);
                    if(d < tw.rng && d < minD) { minD = d; closest = e; }
                }
            });
            if(closest) {
                tw.cool = 1.0 / tw.atkSpd;
                game.projs.push({ x: tw.x, y: game.h * 0.55, tx: closest.x, ty: closest.y - 35, p: side === 'p' ? '🔰' : '🔥', d: tw.dmg, target: closest, dead: false, color: side === 'p' ? "#00e676" : "#ff1744", isTower: true });
                spawnHit(tw.x, game.h * 0.55, side === 'p' ? "#00e676" : "#ff1744");
            }
        }
    });
}

function drawTowers(ctx) {
    const towerSize = 100;
    ctx.save(); ctx.translate(game.towers.p.x, game.h * 0.58);
    const pHpPercent = game.towers.p.hp / game.towers.p.max;
    ctx.shadowBlur = 30 * pHpPercent; ctx.shadowColor = "#00e676";
    ctx.font = `${towerSize}px Arial`; ctx.textAlign = "center"; ctx.fillText("🏰", 0, 0);
    ctx.font = "bold 14px Arial"; ctx.fillStyle = "white"; ctx.shadowBlur = 0;
    ctx.fillText(`${Math.floor(game.towers.p.hp)}`, 0, 35); ctx.restore();

    ctx.save(); ctx.translate(game.towers.e.x, game.h * 0.58);
    const eHpPercent = game.towers.e.hp / game.towers.e.max;
    ctx.shadowBlur = 30 * eHpPercent; ctx.shadowColor = "#ff1744";
    ctx.font = `${towerSize}px Arial`; ctx.textAlign = "center"; ctx.fillText("🏯", 0, 0);
    ctx.font = "bold 14px Arial"; ctx.fillStyle = "white"; ctx.shadowBlur = 0;
    ctx.fillText(`${Math.floor(game.towers.e.hp)}`, 0, 35); ctx.restore();
}

// === GAME LOOP ===
function update(dt) {
    game.frameCount++;
    if(game.elixir < CFG.elixirMax) game.elixir += CFG.regen * dt;
    game.ents.forEach(e => e.update(dt));
    game.ents = game.ents.filter(e => e.hp > 0);
    updateTowers(dt);

    game.projs.forEach(p => {
        if(p.dead) return;
        let tx = p.target ? p.target.x : p.tx;
        let ty = p.target ? p.target.y - 35 : p.ty;
        let dx = tx - p.x, dy = ty - p.y;
        let dist = Math.sqrt(dx*dx + dy*dy);
        if(dist < 20) { 
            p.dead = true; 
            if(p.target && p.target.hp > 0) { 
                p.target.hp -= p.d; spawnHit(p.x, p.y, p.color, p.d); 
                if(!muted) AUDIO.hit.currentTime = 0, AUDIO.hit.play().catch(()=>{}); 
            }
        } else { p.x += (dx/dist) * 900 * dt; p.y += (dy/dist) * 900 * dt; }
    });
    game.projs = game.projs.filter(p => !p.dead);

    game.particles.forEach(p => p.update(dt));
    game.particles = game.particles.filter(p => p.life > 0);
    game.floatingTexts.forEach(t => t.update(dt));
    game.floatingTexts = game.floatingTexts.filter(t => t.life > 0);

    game.wTimer += dt;
    const waveInterval = Math.max(2.5, 4.5 - player.wave * 0.15);
    if(game.wTimer > waveInterval) {
        game.wTimer = 0;
        let keys = Object.keys(UNIT_DB);
        const enemyLevel = Math.min(1 + Math.floor(player.wave / 3), 5);
        game.ents.push(new Ent(keys[Math.floor(Math.random()*keys.length)], false, enemyLevel, game.ents.filter(e=>!e.isP).length));
    }

    let pUnits = game.ents.filter(e => e.isP);
    if(pUnits.length) {
        let avgX = pUnits.reduce((a,b)=>a+b.x, 0) / pUnits.length;
        let targetCam = Math.max(0, Math.min(avgX - game.w/2, CFG.mapW - game.w));
        game.camX += (targetCam - game.camX) * 0.06;
    }
    if(game.shake > 0) game.shake -= dt * 40;

    document.getElementById('elixir-txt').innerText = Math.floor(game.elixir);
    document.getElementById('elixir-bar').style.width = (game.elixir/10)*100 + "%";
    const pHpPct = Math.max(0, (game.towers.p.hp/game.towers.p.max)*100);
    const eHpPct = Math.max(0, (game.towers.e.hp/game.towers.e.max)*100);
    document.getElementById('hp-p').style.width = pHpPct + "%";
    document.getElementById('hp-e').style.width = eHpPct + "%";
    document.getElementById('hp-p-text').innerText = `${Math.floor(game.towers.p.hp)}/${game.towers.p.max}`;
    document.getElementById('hp-e-text').innerText = `${Math.floor(game.towers.e.hp)}/${game.towers.e.max}`;
    document.getElementById('wave-display').innerText = "WELLE " + player.wave;

    game.battleDeck.forEach(k => {
        const card = document.getElementById('card-'+k);
        if(card) {
            if(game.elixir >= UNIT_DB[k].cost) { card.classList.add('ready'); card.classList.remove('disabled'); }
            else { card.classList.add('disabled'); card.classList.remove('ready'); }
        }
    });

    if(game.towers.p.hp <= 0) endGame(false);
    if(game.towers.e.hp <= 0) endGame(true);
}

function draw() {
    let ctx = game.ctx; ctx.clearRect(0, 0, game.w, game.h);
    ctx.save();
    if(game.shake > 0) ctx.translate((Math.random()-0.5)*game.shake, (Math.random()-0.5)*game.shake);
    ctx.translate(-game.camX, 0);

    // Background with parallax
    ctx.drawImage(IMAGES.bg, 0, 0, CFG.mapW, game.h);

    // Ground line
    ctx.strokeStyle = "rgba(255,255,255,0.1)";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, game.h * 0.62);
    ctx.lineTo(CFG.mapW, game.h * 0.62);
    ctx.stroke();

    // Lane markers
    for(let i = 0; i < 3; i++) {
        let y = (game.h * 0.55) + (i * 40 - 40);
        ctx.strokeStyle = "rgba(255,255,255,0.05)";
        ctx.setLineDash([10, 20]);
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(CFG.mapW, y);
        ctx.stroke();
    }
    ctx.setLineDash([]);

    drawTowers(ctx);

    // Sort by Y for depth
    game.ents.sort((a,b) => a.y - b.y).forEach(e => e.draw(ctx));

    // Projectiles
    game.projs.forEach(p => {
        ctx.font = "24px Arial"; ctx.fillText(p.p, p.x-12, p.y+8);
        // Trail effect
        ctx.fillStyle = p.color || "#fff";
        ctx.globalAlpha = 0.3;
        ctx.beginPath(); ctx.arc(p.x, p.y, 8, 0, Math.PI*2); ctx.fill();
        ctx.globalAlpha = 1;
    });

    game.particles.forEach(p => p.draw(ctx));
    game.floatingTexts.forEach(t => t.draw(ctx));

    ctx.restore();
}

function endGame(win) {
    game.active = false; AUDIO.bgm.pause();
    let tx = win ? game.towers.e.x : game.towers.p.x;
    spawnTowerExplosion(tx, game.h * 0.6);
    if(win) { 
        if(!muted) AUDIO.victory.play(); 
        player.coins += 200 + (player.wave * 15); player.wave++; 
        toast("🏆 SIEG! Basis zerstört! +" + (200 + (player.wave * 15)) + "🪙"); 
    }
    else toast("💀 DEINE BASIS IST GEFALLEN...");
    save();
    setTimeout(() => { 
        document.getElementById('game-screen').classList.remove('active'); 
        document.getElementById('menu-screen').classList.add('active'); 
        renderMenu(); 
    }, 3000);
}

function resize() { game.w = window.innerWidth; game.h = window.innerHeight; game.cvs.width = game.w; game.cvs.height = game.h; }

function loop(t) { 
    if(!game.active) return; 
    let dt = Math.min(0.1, (t - game.lastT)/1000); 
    game.lastT = t; 
    update(dt); 
    draw(); 
    requestAnimationFrame(loop); 
}

// === GAME START ===
function startGame() {
    if(player.deck.length !== CFG.deckSize) return toast(`Wähle erst ${CFG.deckSize} Karten!`);
    document.getElementById('menu-screen').classList.remove('active');
    document.getElementById('game-screen').classList.add('active');
    game.cvs = document.getElementById('gameCanvas'); game.ctx = game.cvs.getContext('2d'); resize();
    game.elixir = 5; game.ents = []; game.projs = []; game.particles = []; game.floatingTexts = []; game.camX = 0;
    game.towers.p.hp = game.towers.p.max; game.towers.e.hp = game.towers.e.max;
    game.battleDeck = [...player.deck];
    AUDIO.bgm.play().catch(()=>{}); buildDeck(); game.active = true; game.lastT = performance.now();
    requestAnimationFrame(loop);
}

function buildDeck() {
    const dock = document.getElementById('card-dock'); dock.innerHTML = '';
    game.battleDeck.forEach(k => {
        const card = document.createElement('div'); 
        card.className = 'game-card disabled'; 
        card.id = 'card-' + k;
        card.onclick = () => spawn(k); 
        card.innerHTML = `<div class="g-cost">${UNIT_DB[k].cost}</div><img src="${IMAGES[k].src}" class="g-img" onerror="this.style.display='none'"><div class="g-name">${UNIT_DB[k].name}</div><div class="g-level">Lv${player.units[k].l}</div>`;
        dock.appendChild(card);
    });
}

function spawn(k) {
    if(game.elixir >= UNIT_DB[k].cost) {
        game.elixir -= UNIT_DB[k].cost;
        game.ents.push(new Ent(k, true, player.units[k].l, game.ents.filter(e=>e.isP).length));
        spawnSpawnEffect(game.towers.p.x + 40, game.h * 0.55, true);
        if(!muted) AUDIO.spawn.cloneNode().play();
    }
}

// === EVENTS ===
document.getElementById('start-btn').onclick = startGame;
document.getElementById('mute-toggle').onclick = () => { 
    muted = !muted; 
    AUDIO.bgm.muted = muted; 
    AUDIO.hit.muted = muted; 
    document.getElementById('mute-toggle').innerText = muted ? "🔇" : "🔊"; 
};
window.addEventListener('resize', resize);
window.onload = () => { load(); renderMenu(); };
</script>
</body>
